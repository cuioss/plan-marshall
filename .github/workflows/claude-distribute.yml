name: Claude Distribute

# Publish per-target marketplace roots to orphan distribution branches and,
# on `v*` source tags, immutable dist tags. The job is parameterized via
# strategy.matrix on target identity so additional targets (e.g. opencode)
# plug in as a one-line append.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

# Default the workflow token to read-only. Every write in this workflow goes
# through the separate cui-release-bot app token (steps.release-token.outputs.token):
# the orphan-branch publish (peaceiris/actions-gh-pages personal_token) and the
# dist-tag push (ad-m/github-push-action github_token) both use it, and the tag is
# created locally before that push. The default GITHUB_TOKEN therefore needs only
# read; no step requires a per-step write grant.
permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.target_name }}
    runs-on: ubuntu-latest
    # Serialize distribute runs per target so concurrent pushes never race on
    # the orphan-branch force-push or the previous-manifest fetch. Runs queue
    # (cancel-in-progress: false) rather than cancel, preserving monotonic
    # publishing. Keyed by target so the claude and opencode legs run in
    # parallel with each other but each serializes against its own re-runs.
    concurrency:
      group: claude-distribute-${{ matrix.target_name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: claude
            branch_name: dist-claude
            dist_tag_prefix: claude
            publish_dir: target/claude
            generator_target_flag: claude
          - target_name: opencode
            branch_name: dist-opencode
            dist_tag_prefix: opencode
            publish_dir: target/opencode
            generator_target_flag: opencode
    steps:
      - name: Generate Release Bot Token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required for the first-parent commit count that
          # derives the deterministic 0.1.N version (git rev-list --count
          # --first-parent HEAD). A shallow checkout would undercount N.
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Compute deterministic version
        id: version
        run: |
          set -euo pipefail
          base=$(python3 -c "import json; print(json.load(open('marketplace/.claude-plugin/marketplace.json')).get('metadata', {}).get('version', '0.1'))")
          count=$(git rev-list --count --first-parent HEAD)
          version="${base}.${count}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Computed deterministic version: ${version}"

      - name: Fetch previous dist-manifest from dist branch tip
        env:
          BRANCH_NAME: ${{ matrix.branch_name }}
        run: |
          set -uo pipefail
          if git fetch origin "${BRANCH_NAME}" 2>/dev/null; then
            if git cat-file -e "origin/${BRANCH_NAME}:dist-manifest.json" 2>/dev/null; then
              git show "origin/${BRANCH_NAME}:dist-manifest.json" > previous-dist-manifest.json
              echo "Fetched previous dist-manifest from origin/${BRANCH_NAME} tip"
            else
              echo "No dist-manifest.json on origin/${BRANCH_NAME} — first publish for this target"
            fi
          else
            echo "Branch ${BRANCH_NAME} does not exist yet — first publish for this target"
          fi

      - name: Regenerate target directory
        env:
          GENERATOR_TARGET_FLAG: ${{ matrix.generator_target_flag }}
          PUBLISH_DIR: ${{ matrix.publish_dir }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 marketplace/targets/generate.py \
            --target "${GENERATOR_TARGET_FLAG}" \
            --output "${PUBLISH_DIR}" \
            --version "${VERSION}" \
            --previous-manifest previous-dist-manifest.json

      - name: Publish to orphan branch (cui-release-bot identity)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ steps.release-token.outputs.token }}
          publish_branch: ${{ matrix.branch_name }}
          publish_dir: ./${{ matrix.publish_dir }}
          force_orphan: true
          enable_jekyll: true
          user_name: cui-release-bot
          user_email: cui-release-bot@cuioss.de
          commit_message: "chore(dist): publish ${{ matrix.publish_dir }} from ${{ github.sha }}"

      - name: Create dist tag (release flow only)
        if: startsWith(github.ref, 'refs/tags/v')
        # Pass every context value in through env and reference it as a quoted
        # shell variable. github.ref_name is attacker-influenceable (a ref name
        # can carry shell metacharacters); interpolating it directly into this
        # run: block would be a template-injection surface. The matrix values are
        # trusted, but they are passed the same way so no context expression is
        # ever spliced into the shell.
        env:
          DIST_TAG_PREFIX: ${{ matrix.dist_tag_prefix }}
          REF_NAME: ${{ github.ref_name }}
          BRANCH_NAME: ${{ matrix.branch_name }}
          TARGET_NAME: ${{ matrix.target_name }}
        run: |
          set -euo pipefail
          dist_tag="${DIST_TAG_PREFIX}/${REF_NAME}"
          git config user.name 'cui-release-bot'
          git config user.email 'cui-release-bot@cuioss.de'
          git fetch origin "${BRANCH_NAME}"
          git tag -a "${dist_tag}" \
            -m "Distribution for ${TARGET_NAME} ${REF_NAME}" \
            "origin/${BRANCH_NAME}"

      - name: Push dist tag (release flow only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ steps.release-token.outputs.token }}
          tags: true
          branch: ${{ matrix.branch_name }}
