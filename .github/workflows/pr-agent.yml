# Third automated PR reviewer (PR-Agent on Google Gemini), beside CodeRabbit and Sourcery.
#
# All review tuning is central in cuioss/pr-agent-settings (.pr_agent.toml) — nothing is
# configured here. The org skip rules (dependabot[bot], cuioss-release-bot[bot], the
# skip-bot-review label, fork PRs) are enforced by the reusable workflow's job-level `if:`
# guard, because PR-Agent's own ignore_pr_* settings are inert in GitHub Action mode.
#
# See https://github.com/cuioss/pr-agent-settings/blob/main/README.adoc

name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  # ⛔ Do NOT add `synchronize` here on its own. It was added in #1048 and reverted the
  # same day: PR-Agent's runner GATES the synchronize action behind two settings that
  # both default off (github_action_runner.py:117-154) —
  # `github_action_config.handle_push_trigger` (default false) and
  # `github_action_config.push_commands` (default empty). With the event delivered but
  # the trigger off, the runner logs "Skipping action: synchronize", produces no review,
  # and the fail-closed gate correctly reports the job as FAILURE. Net effect: a red
  # `review / review` check on every push and still no review — strictly worse than not
  # subscribing to the event.
  #
  # Enabling it properly needs BOTH settings AND a narrower fail-closed gate: the runner
  # also returns without output on a merge commit, a bot commit, and an unchanged SHA
  # (lines 128-146), so those legitimate no-ops would fail the gate too.
  #
  # On-demand commands (/review, /ask, /improve, /help). Also how a re-review is requested
  # after pushing fixes — there is deliberately no automatic re-review on every push.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Required: mints the OIDC token Workload Identity Federation exchanges for the short-lived
  # GCP credentials the reviewer uses to reach Gemini on Vertex AI.
  id-token: write

jobs:
  review:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-pr-agent-review.yml@146d2d377eea7ffae0c73f06df8087a0948a534a # v0.22.0
    with:
      # PILOT, repository-scoped. `/review` is not the surface that finds defects here, and
      # that is a measured result rather than a hypothesis. Across 223 findings stores and
      # 224 pull requests, `/review` published 51 PR Reviewer Guides carrying 17 findings in
      # total — 73% of them the bare "No major issues detected" table. Neither knob the
      # central config reaches moved it: the model was swapped across 3.5-flash / 2.5-pro /
      # 3.6-flash for byte-identical output, and the charter was rewritten twice
      # (pr-agent-settings #5 and #13, the second explicitly to contest the empty-list
      # permission and to raise num_max_findings to 12) for a silent rate of 76.5% → 73.3%.
      #
      # The cause is not reachable from configuration. `key_issues_to_review`'s own field
      # description in the pinned image grants permission to return an empty list, and
      # extra_instructions is appended as a separate block — it argues alongside that
      # description instead of replacing it. Two rounds of stronger argument bought three
      # points, which is the measurement that closes the charter lane.
      #
      # `/improve` is a DIFFERENT tool with a different prompt and no empty-list clause. It
      # has been fully tuned in cuioss/pr-agent-settings since #14 — commitable_code_suggestions
      # publishes it as inline review comments, which plan-marshall's automatic-review already
      # declares as participation evidence for this bot — and it has never once run on a real
      # pull request in this repository: zero inline records across the whole corpus. The
      # ordinary opt-in is a per-PR `pr-agent-improve` label that nobody applies, so the
      # capability has been configured and unused.
      #
      # ⚠ KNOWN GAP, accepted deliberately for the pilot and NOT to be mistaken for a guarded
      # surface: the reusable workflow's fail-closed gate keys on the `review` output and is
      # deliberately not extended to `/improve`, which writes the separate `improve` key. At the
      # GATE, a run producing nothing and a run that never happened remain one signal — the
      # collapsed state this repository's review-apparatus epic exists to fix (PLAN-PR-026).
      # Closing it needs an oracle in the ORG workflow, out of scope for a caller-side pilot.
      #
      # At the PULL REQUEST surface the two ARE separable, confirmed on this pilot's own PR
      # (#1334): an empty `/improve` publishes a distinct `issue_comment` headed
      # `## PR Code Suggestions ✨` reading "No code suggestions found for the PR." It announces
      # its silence rather than staying quiet. plan-marshall's automatic-review consumes that
      # surface, so the pipeline can tell the two apart even while the gate cannot — and the
      # pr-agent registry now carries an `ignore_patterns` entry so that announcement is not
      # filed as a finding on every clean pull request.
      #
      # Reversible in one line. Remove this input to return to label-only opt-in.
      auto-improve: true
    # Map only what the reviewer needs. `secrets: inherit` would hand it every secret this
    # repo can see (GPG keys, Sonatype credentials, SONAR_TOKEN, …) for no reason; these two
    # are the whole requirement, because Vertex AI is reached keylessly.
    secrets:
      REVIEW_APP_ID: ${{ secrets.REVIEW_APP_ID }}
      REVIEW_APP_PRIVATE_KEY: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
