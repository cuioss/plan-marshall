# Depends on the leaf distribution and on the root, both by published name.
# `install_requires` is a newline-separated list, so the reader must split lines
# before extracting each PEP 508 name.
[metadata]
name = setuptools-app
version = 1.0.0
description = Depends on the leaf distribution and on the root.

[options]
install_requires =
    setuptools-core-lib>=1.0.0
    setuptools-platform>=1.0.0
