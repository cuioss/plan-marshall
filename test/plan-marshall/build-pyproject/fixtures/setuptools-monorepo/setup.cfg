# A setuptools monorepo root declaring everything in setup.cfg. There is no
# pyproject.toml anywhere in this fixture: _find_descriptor_file admits setup.cfg
# as a descriptor, so every module here is discovered, stamped with a real
# paths.descriptor, and enters the join's scope — which is why contributing
# nothing is worse than being filtered out.
[metadata]
name = setuptools-platform
version = 1.0.0
description = Fixture root aggregating the setuptools-managed distributions.

[options]
install_requires =
    setuptools-core-lib>=1.0.0
    typing-extensions>=4.0.0
