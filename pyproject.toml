[project]
name = "plan-marshall"
version = "0.1.0"
# Consumer-facing support claim: the minimum interpreter this project supports.
# It is deliberately a floor, not a pin — the build's interpreter is pinned by
# UV_PYTHON below.
requires-python = ">=3.12"

# The multi-target generator reads component frontmatter with a real YAML
# parser rather than a line scanner. Twelve verification rounds on the
# hand-rolled reader produced sixteen behavioural defects, every one of them a
# divergence from YAML, three of them the same fail-open in the same function
# answered by three different indentation rules. See
# marketplace/targets/component_targets.py for the contract this now inherits.
dependencies = [
    "PyYAML>=6.0.3",
]

# =============================================================================
# Dev Toolchain
# =============================================================================
#
# The dev tools live in a PEP 735 dependency group, NOT in
# [tool.pyprojectx.main].requirements, so that *uv* owns the environment they
# run in. uv resolves this group into uv.lock and installs it into the project
# .venv, whose interpreter is pinned deterministically by UV_PYTHON. Pyprojectx
# installs no tool that touches project code any more — it only bootstraps uv —
# so its own venv interpreter (which it derives from whichever python3 invoked
# ./pw, and which no pyproject.toml key can select) no longer influences what
# runs the tests or the type checker. See doc/developer/build.adoc §
# "Which Interpreter Runs the Build".
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12.20260815",
]

[tool.uv]
# `dev` is uv's implicit default group. Stated explicitly so the tool
# environment does not silently depend on that implicit default.
default-groups = ["dev"]

# =============================================================================
# Pyprojectx Configuration
# =============================================================================

[tool.pyprojectx]

[tool.pyprojectx.env]
# THE interpreter pin for the entire build, local and CI alike.
#
# pyprojectx exports this map into the environment of every alias it runs
# (cli.py::_run_alias -> env.py::IsolatedVirtualEnv.run merges it over
# os.environ), and build.py's nested `uv run` subprocesses inherit it. uv
# therefore resolves 3.12 for the project .venv on every path — and downloads a
# managed CPython 3.12 when the host has none — regardless of which python3
# happened to invoke ./pw. This replaces the former lock-python-version = "3.12"
# declaration, which reached only `uv pip compile --python-version` when
# rewriting pw.lock and was provably inert for the runtime environment.
UV_PYTHON = "3.12"

[tool.pyprojectx.main]
# Bootstrap only. uv is the sole tool pyprojectx installs; everything that
# touches project code is resolved by uv from [dependency-groups].dev above.
requirements = [
    "uv",
]

[tool.pyprojectx.aliases]
# Dependency management
install = "uv sync"
lock = "uv lock"
add = "uv add"

# Build commands with module filtering (canonical commands from extension_base.py)
# Usage: ./pw <command> [module]
# Examples:
#   ./pw compile                    # All bundles
#   ./pw compile pm-dev-frontend    # Single bundle
#   ./pw module-tests plan-marshall   # Single test directory
build = "uv run python build.py"
compile = "uv run python build.py compile"
test-compile = "uv run python build.py test-compile"
module-tests = "uv run python build.py module-tests"
quality-gate = "uv run python build.py quality-gate"
coverage = "uv run python build.py coverage"
verify = "uv run python build.py verify"
clean = "uv run python build.py clean"

# Shortcuts for common operations (no module filtering).
# Routed through `uv run` like every other tool invocation: a bare `ruff` would
# resolve from PATH, i.e. from the pyprojectx venv, which no longer carries it.
lint = "uv run ruff check marketplace/bundles/ marketplace/targets/ test/ .claude/"
lint-fix = "uv run ruff check marketplace/bundles/ marketplace/targets/ test/ .claude/ --fix"
fmt = "uv run ruff format marketplace/bundles/ test/ .claude/"
format = "uv run ruff format marketplace/bundles/ test/ .claude/"

# Multi-target generator (Claude Code, OpenCode, …) — see marketplace/targets/.
generate = "uv run python marketplace/targets/generate.py"
generate-claude = "uv run python marketplace/targets/generate.py --target claude --output target/claude"
generate-opencode = "uv run python marketplace/targets/generate.py --target opencode --output target/opencode"

# Claude-target content-drift gate — the Stage 3 verify sub-step of the
# marshall-steward `upgrade` verb. It is an alias for the same reason the
# generate-* pair above is one: the CLI imports `marketplace.targets`, which
# pulls in PyYAML, and that dependency lives in the uv-owned project .venv. A
# bare `python3 marketplace/targets/claude/content_drift_cli.py` resolves the
# host interpreter instead and dies on `ModuleNotFoundError: No module named
# 'yaml'`, so the wrapper is what makes the documented command runnable at all.
content-drift = "uv run python marketplace/targets/claude/content_drift_cli.py"

# =============================================================================
# Tool Configurations
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["test"]
# Project root on pythonpath so ``marketplace.targets.*`` (the multi-target
# generator package) imports cleanly during pytest collection.
pythonpath = [".", "test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["fixtures", "__pycache__", ".git"]
addopts = ["-v", "--tb=short", "--strict-markers", "--strict-config", "--durations=25"]
# Every warning is an error. Armed on a measured census, not on optimism: a full
# whole-tree run under the flags above emitted ZERO warnings — no
# warnings-summary section at all, in any category, from third-party or
# project-owned code. With an empty census the gate costs nothing today and
# turns the *next* warning introduced into an attributable failure at the commit
# that introduces it, rather than letting it accumulate silently.
#
# The census is stated WITHOUT a test-count population, deliberately. The figure
# that used to stand here was a snapshot of the collected count at the moment the
# gate was armed, and every commit since moved it — so it went stale immediately
# and then read as a current measurement. The property worth stating is the EMPTY
# census, and that one is re-established by every full run rather than by a
# number in a comment: with ``error`` armed, a warning appearing anywhere fails
# the run that meets it. A population figure beside it proves nothing the run
# does not already prove, and adds one more claim that can silently go wrong.
#
# No per-item ignore entry is warranted, because there is no warning to ignore;
# if one becomes necessary later it belongs here in the narrowly-scoped
# ``ignore:{message-prefix}:{Category}:{module}`` form, never as a bare
# ``ignore::SomeWarning``.
filterwarnings = ["error"]
# Fail (with a traceback at the hang point) instead of wedging a worker forever.
#
# The threshold is set against the suite's DECLARED ceiling, not against its
# observed maximum, because the two no longer coincide. The ordinary suite is
# fast — it runs in ~2.5 min (measured 151.69s, warm cache) under ``-n auto``,
# 10 xdist workers on the measuring host, and the slowest ordinary test in the
# ``--durations=25`` table is ~13s. But one test is not an ordinary unit: the
# ``slow_live`` live-tree characterization in
# ``test/plan-marshall/script-shared/test_argparse_surface.py`` runs a real
# argparse derivation over EVERY registered notation, and it declares its own
# ``DerivationConfig(total_budget_seconds=240.0)`` — a true total wall-clock
# deadline for the whole batch. Its warm-cache duration (~2.6s) is not its cost:
# a fresh checkout pays a cold derivation, which is what that 240s budget is
# sized for.
#
# 300 therefore sits deliberately ABOVE that 240s declared ceiling with enough
# margin for per-test overhead, rather than an order of magnitude above the
# ordinary maximum. A test that exceeds 300s has blown past the only declared
# budget in the suite and is hung, not slow — surface it as an attributable
# failure with a stack rather than an opaque job timeout. Neither number moves
# alone: the coupling is restated at the budget literal in that test.
#
# The threshold is otherwise NOT retightened toward the measured maximum: it is
# a hang detector, not a performance budget, and slack absorbs a slower CI host
# without turning a slow-but-healthy test into a false failure. The default
# signal method (SIGALRM on each worker's main thread, where xdist runs its
# tests) is used deliberately: the thread method's watchdog leaves the worker in
# an unclean state on teardown under xdist.
timeout = 300
# ``timeout = 300`` is a suite-wide DEFAULT, not a ceiling. A handful of tests
# scan the WHOLE marketplace (the plugin-doctor quality gate and its analyzer
# sweeps) and contend with the compile and lint legs under ``verify``, where they
# exceed 300 while passing standalone. Those carry a per-test
# ``@pytest.mark.timeout(N)`` naming why they need more, rather than raising the
# suite default — which is coupled to the ``slow_live`` budget above and must not
# drift up to accommodate a different class of test.
#
# ``timeout`` is NOT registered below and does not need to be: pytest-timeout
# registers its own marker via ``addinivalue_line`` in its ``pytest_configure``,
# so ``--strict-markers`` is satisfied by the plugin.
#
# Custom-marker registry — the SINGLE source of truth for every non-built-in,
# non-PLUGIN-provided ``@pytest.mark.<name>`` in the suite. Declared here rather
# than through ``config.addinivalue_line`` in ``test/conftest.py::pytest_configure``
# so the registry is data, not code. A whole-tree sweep of ``@pytest.mark.<name>`` plus the
# markers applied programmatically in ``pytest_collection_modifyitems`` confirms
# these six are the complete set of custom markers in use; ``timeout`` and
# ``parametrize`` are excluded from that set as plugin- and pytest-owned.
markers = [
    # ``allow_pollution`` is a DELIBERATE ESCAPE HATCH, retained by design: it
    # is the single opt-out a test uses when it must exercise the real
    # credentials path or the real tracked ``.plan/`` tree instead of the
    # per-test sandboxes. Three autouse fixtures honour it
    # (``_pollution_guard``, ``_plan_base_dir_sandbox``,
    # ``_credentials_dir_sandbox``), so it is intentionally NOT a candidate for
    # removal — a real-tree test has no other way to reach the genuine
    # resolvers.
    "allow_pollution: test may legitimately mutate the real ~/.plan-marshall/credentials/ directory or the tracked .plan/ tree (opts out of the autouse PLAN_BASE_DIR and CREDENTIALS_DIR sandboxes and the pollution guard).",
    "xdist_group(name): pin all tests sharing the same group name to a single xdist worker (requires --dist=loadgroup).",
    # ``allow_daemon_routing`` is the second DELIBERATE ESCAPE HATCH, and the
    # narrower of the two. The autouse ``_neutralize_daemon_routing`` fixture in
    # ``test/conftest.py`` patches the D5 ``_route_to_daemon`` seam to its
    # non-routing outcome for every test, so no test's behaviour depends on
    # whether a marshalld daemon happens to be registered and ready on the host.
    # Modules under ``test/plan-marshall/build-server/`` are carved out BY
    # LOCATION and need no marker; this marker exists for a routing-owning test
    # that lives OUTSIDE that directory and must therefore re-arm the real seam
    # explicitly.
    "allow_daemon_routing: test owns the marshalld build-routing seam as its subject and must run against the real _route_to_daemon (opts out of the autouse _neutralize_daemon_routing fixture; unnecessary under test/plan-marshall/build-server/, which is carved out by location).",
    # ``allow_root_filesystem_pollution`` is the third escape hatch and the
    # sibling of ``allow_pollution`` for the filesystem ROOT. The autouse
    # ``_root_fs_pollution_guard`` fixture in ``test/conftest.py`` clears the
    # ``/nonexistent`` absence-sentinel before every test and fails any test
    # that materializes it — a leak only a ROOT (uid 0) host can produce, where
    # the OS bypasses the DAC permission check that keeps ``/`` unwritable on a
    # developer machine and on CI. This marker opts a test out for the case
    # where a real-root write under ``/`` is genuinely its subject. No test
    # needs it today; it exists so the guard has a documented escape hatch.
    "allow_root_filesystem_pollution: test may legitimately materialize a path under the filesystem root (opts out of the autouse _root_fs_pollution_guard). Only meaningful on a root host.",
    # ``slow_live`` is a SELECTION label, not an escape hatch: no fixture reads
    # it and nothing is deselected by default, so a full run — local or CI —
    # still executes every marked test. It exists so a fast local loop can say
    # ``-m 'not slow_live'``, and so the ``timeout = 300`` rationale above can
    # name which test is allowed to approach the detector instead of claiming an
    # order-of-magnitude margin the suite no longer has. Marked tests carry their
    # own declared wall-clock budget; that budget and ``timeout`` move together.
    "slow_live: test drives a real derivation over the live tree under its own declared wall-clock budget, so it is the one test whose runtime approaches the pytest-timeout hang detector (deselect a slow local loop with -m 'not slow_live').",
    # ``touches_real_state`` scopes the autouse ``_pollution_guard``. Every test
    # is already sandboxed by ``_plan_base_dir_sandbox`` /
    # ``_credentials_dir_sandbox`` (a real-tree write is structurally
    # impossible), so the guard's before/after real-path snapshot — which reads
    # the developer's real ``~/.plan-marshall/credentials/`` listing on every
    # test — is a BACKSTOP that only needs to verify the redirect held for the
    # tests that drive that state. The marker is applied by DERIVATION in
    # ``pytest_collection_modifyitems``, on two signals: the test requests the
    # ``plan_context`` fixture, OR its module names a plan-state context manager
    # (``PlanContext`` / ``EmptyPlanContext`` / ``BuildContext``) or sets
    # ``PLAN_BASE_DIR``. The fixture signal alone left the state-driving modules
    # that never touch that fixture unmarked, so the backstop skipped exactly the
    # tests it exists for. Pure-logic tests still skip the snapshot.
    "touches_real_state: test drives real credential/plan state, so the autouse _pollution_guard runs its before/after real-path snapshot for it (derived at collection time by pytest_collection_modifyitems from the plan_context fixture request, or from the test module naming PlanContext/EmptyPlanContext/BuildContext or setting PLAN_BASE_DIR).",
]

[tool.coverage.run]
# The coverage denominator is deliberately restricted to the shipped product
# surface. `marketplace/bundles` is what this repository ships; `build.py`,
# `marketplace/targets/**` and `.claude/skills/**` are build- and
# developer-tooling surfaces that sit outside it on purpose, even though tests
# do exercise all three.
#
# This key is NOT the whole story: `build.py:cmd_coverage` passes
# `--cov={bundle_path}` on every coverage invocation, and pytest-cov applies
# that over the `source` value below. Widening the denominator therefore
# requires editing both sites in lock-step — changing `source` alone is inert.
# See doc/developer/build.adoc § "Tool Configuration" for the recorded decision
# and the conditions under which widening becomes worth revisiting.
source = ["marketplace/bundles"]
branch = true
omit = [
    "*/scripts/__pycache__/*",
    "test/*",
    "*/test_*.py",
    "**/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["marketplace/bundles", "marketplace/targets", "test", ".claude"]
# Parallel worktrees under ``.claude/worktrees/`` are isolated working copies
# of other in-flight branches. They contribute neither to this branch's tree
# nor to its lint scope; mirror the mypy exclude here so ruff doesn't flag
# unrelated work-in-progress code as drift against this branch.
extend-exclude = [".claude/worktrees/"]

[tool.ruff.lint]
# RUF100 is the entry that keeps the rest of this list honest. It fails on a
# `# noqa` directive that suppresses nothing — one naming a rule this config
# never enabled, or one whose rule no longer fires at that site. Left
# unchecked, such a directive outlives the diagnostic it was written for and
# then reads, to the next person, as a live warning about a problem the code
# no longer has; worse, it silently widens over time, because a directive
# nobody can see failing is a directive nobody removes.
#
# Armed on a clean tree, and only after the sweep that made it clean: every
# such directive across the four lint roots (`marketplace/bundles/`,
# `marketplace/targets/`, `test/`, `.claude/`) was either converted to a
# plain-language comment stating the intent the rule code used to carry, or
# narrowed to the codes still doing work. The rule therefore costs nothing
# today and turns the next stale suppression into a failure at the commit
# that introduces it, rather than letting the population grow back.
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# F401 and F811 are ignored across the test tree because pytest's fixture
# resolution makes both fire on correct code, and no code change reaches
# either. A fixture is resolved BY NAME at call time, so the import that puts
# it in the module's namespace is never read as a name (F401), and a test that
# takes it as a parameter shadows that binding by design (F811). Both are the
# framework's semantics, not dead code — the only way to silence them per site
# is a suppression comment, and F811 is reported at the PARAMETER, out of reach
# of any directive on the import, so it needs a module-level one that disables
# redefinition checking for the whole file.
#
# What this costs, stated rather than left to the diff: F401 also catches
# genuinely dead imports, and this turns that off across test/** — the
# redefinition guard against two `def test_x` in one namespace goes with it.
# The population now covered, measured on this tree rather than carried from
# the request, is F401 199 and F811 362, by:
#
#     ruff check test/ --select F401,F811 --statistics --config "lint.per-file-ignores = {}"
#
# The `--config` override is what makes the command re-derivable at all:
# `--select` enables a rule, it does not bypass `per-file-ignores`, so the
# entry below would suppress both codes and the command would report nothing.
#
# This entry changes what the gate REPORTS not at all — it changes where the
# decision is recorded, from a comment at every one of those sites to one
# stated rule here. The per-site directives are gone: with RUF100 armed (see
# `select` above) each was reported as suppressing nothing, which is exactly
# what a rule turned off by this entry makes them. The figure is given with the
# command that produces it because it moves with the tree: re-derive it rather
# than trusting it.
"test/*" = ["B011", "F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["marketplace"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Cross-skill modules are imported by flat name (`from file_ops import ...`) and
# resolved through MYPYPATH, which build.py:_compute_mypypath() derives from the
# same collect_script_dirs() source of truth as the runtime PYTHONPATH. Because
# every by-name import resolves, missing-import silencing is not merely
# unnecessary — it is harmful: it would let a renamed or deleted shared module
# pass static analysis while breaking by-name resolution at runtime. Keeping this
# false makes an unresolvable shared import a hard [import-not-found] error, so a
# rename that misses a call site is caught at compile time.
ignore_missing_imports = false
# Fail on any `# type: ignore` that no longer suppresses a real diagnostic. This
# is what keeps the flat-import boundaries honest: an import-silencing ignore
# cannot be reintroduced without mypy flagging it the moment the underlying
# import resolves.
warn_unused_ignores = true
explicit_package_bases = true
# MYPYPATH is injected at runtime by build.py:_compute_mypypath() via the
# MYPYPATH env var, derived from collect_script_dirs(). Do NOT re-add entries
# for skill scripts/ dirs or their immediate subdirs — they are covered there.
# This list is reserved for entries OUTSIDE that derivation.
#
# ``test/_shared`` is the bundle-neutral home for cross-bundle test helpers that
# every bundle bare-imports (``test/conftest.py`` puts it on ``sys.path`` at
# runtime). Under ``explicit_package_bases`` mypy derives top-level module names
# only from the current directory and ``mypy_path`` entries, so without this
# entry the helper resolves as ``test._shared.<module>`` and every bare importer
# fails with ``[import-not-found]``. The hyphenated ``test/<bundle>/`` dirs need
# no entry: a hyphen is not a valid identifier, so mypy's package-base crawl
# already stops there and yields the bare module name.
mypy_path = ["test/_shared"]
# Exclude extension.py files - they are dynamically loaded via importlib and mypy
# can't distinguish them by path (all named "extension"). This covers both the
# language-domain extensions (plan-marshall-plugin/extension.py) and the
# build-system-owned BuildExtensionBase subclasses (build-*/scripts/extension.py).
# Also exclude test/*/plan-marshall-plugin/ directories - invalid Python package name (contains dashes)
# The same dash-in-package-name limitation applies to every hyphenated test dir
# that carries an __init__.py (present to disambiguate pytest test-file basename
# collisions under the default prepend import mode). Under explicit_package_bases
# mypy derives the package name from the dir name, so a hyphen makes it "not a
# valid Python package name" (exit 2) regardless of mypy version. ./pw verify
# never mypy-checks test/ (cmd_quality_gate compiles only marketplace/bundles),
# so test-compile is the sole surface these break — enumerate them here.
exclude = [
    "plan-marshall-plugin/extension\\.py$",
    "skills/[^/]*/scripts/extension\\.py$",
    "test/.*/plan-marshall-plugin/",
    "test/plan-marshall/tools-permission-fix/test_permission\\.py$",
    "test/.*/integration/",
    "test/finalize-step-deploy-target/",
    "test/finalize-step-sync-plugin-cache/",
    "test/sync-plugin-cache/",
    "test/sync-opencode/",
    "test/pm-documents/ref-ascii-diagrams/",
    "test/plan-marshall/audit-archived-plan-retrospectives/",
    "test/plan-marshall/execute-task/",
    "test/plan-marshall/finalize-step-review-retrospective/",
    "test/plan-marshall/finalize-step-sync-baseline/",
    "test/plan-marshall/manage-personas/",
    "test/plan-marshall/phase-4-plan/",
    "test/plan-marshall/plan-retrospective/",
    "\\.claude/worktrees/",
]

# The only genuinely third-party imports in the tree ship no type information
# (PyYAML's `yaml`, the `tomli` TOML reader). Scope missing-import tolerance to
# exactly these modules so the global `ignore_missing_imports = false` continues
# to catch every unresolved cross-skill import.
[[tool.mypy.overrides]]
module = ["yaml", "tomli"]
ignore_missing_imports = true

# `conftest` is pytest's per-directory fixture module: pytest inserts each test
# directory onto sys.path at collection time so `from conftest import ...` resolves
# at RUNTIME, but that dir is not on mypy's MYPYPATH (and several sibling conftest
# modules share the name, so it cannot be). Scope missing-import tolerance to
# exactly `conftest` so test-compile (mypy over test/) does not choke on the
# fixture import while the global `ignore_missing_imports = false` still catches
# every real cross-skill import. Only test code imports conftest, so this cannot
# mask a production import regression.
[[tool.mypy.overrides]]
module = ["conftest"]
ignore_missing_imports = true
