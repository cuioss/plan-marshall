name: Python Verify

on:
  push:
    branches: [main, "feature/*", "fix/*", "chore/*", "dependabot/**"]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  # Keyed on the event class AND the branch identity, so the push run and the
  # pull_request run for the same branch land in SEPARATE groups and can never
  # cancel one another.
  #
  # Collapsing the push/pull_request pair is the reusable workflow's `gate` job's
  # responsibility, not concurrency's: a push whose commit is already covered by
  # an open PR makes the gate skip the heavy verify and report
  # `verify / conclusion` green in seconds, so a single push to a working branch
  # still produces exactly one full verify run. Sharing one concurrency group
  # across both events raced that gate — the gate needs a few seconds to reach
  # its decision, and a pull_request run entering the shared group inside that
  # window cancelled it mid-flight. The always-reporting `conclusion` job then
  # hard-fails on a cancelled gate (correctly, by its own contract: a cancelled
  # gate must never be masked as a skip), planting a RED `verify / conclusion`
  # check on the pull request's own head SHA. Separate groups remove the race.
  #
  # What concurrency still buys is collapsing STALE runs *within* one event
  # class. cancel-in-progress stays scoped to pull_request, so a new push to a
  # PR cancels that PR's previous, now-obsolete verify run — the ~10 minute
  # saving that matters — while push runs are never cancelled. A merge_group run
  # keys on its own unique queue ref and lands in a group by itself, so the merge
  # queue's re-verification is never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    uses: cuioss/cuioss-organization/.github/workflows/reusable-pyprojectx-verify.yml@47273b80f2d215fd277883956000407eb708db15 # v0.39.0
    with:
      # Opt in to the footprint gate: skip the heavy build+tests when every
      # changed path is non-building (docs/config). The always-reporting
      # `verify / conclusion` job still reports green on a skipped run, so the
      # required check is satisfied and the merge queue never stalls. A
      # merge_group run and any change touching buildable source still verify.
      skip-on-docs-only: true
      # Generate the target trees BEFORE verify, in this same job and workspace.
      #
      # `test_target_tree_foundational_skill_freshness.py` asserts that no
      # deployed target tree names a foundational skill the marketplace retired.
      # Its population is the GENERATED trees under `target/`, and it refuses to
      # read an empty population as a clean sweep — so on a clean checkout, where
      # nothing has generated them, that refusal is unconditionally red. A
      # separate generate job cannot fix it: jobs do not share a filesystem
      # without artifacts, and a `uses:` job cannot be given an injected
      # download step.
      #
      # `generate` is passed through the same `^[a-z][a-z0-9-]*$` allowlist as
      # `verify-goals`; the args are word-split data handed to `./pw` as
      # arguments, never interpolated into a shell body. `all` writes every
      # registered target to `target/<target-name>`.
      pre-verify-goals: 'generate'
      pre-verify-args: '--target all --output target'
